[package]
name = "card-station"
version = "0.1.0"
edition = "2021"
description = "PATS University Card Station: encodes NTAG213 member cards with an ACR122U reader (macOS, PC/SC)."
publish = false

[[bin]]
name = "card-station"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
pcsc = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
