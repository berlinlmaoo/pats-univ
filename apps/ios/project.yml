name: PATS
options:
  bundleIdPrefix: id.znetworks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 5YR5T42G97
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PATS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.znetworks.patsuniv
        PRODUCT_NAME: PATS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PATS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PATS_DEV_SERVER_URL: https://pats-dev.invalid
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG PATS_DEV_SERVER"
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    preBuildScripts:
      - name: Check Localization keys
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/scripts/check-localization.sh"'
    postBuildScripts:
      - name: Dev server address
        basedOnDependencyAnalysis: false
        script: |
          case " $SWIFT_ACTIVE_COMPILATION_CONDITIONS " in *" PATS_DEV_SERVER "*) ;; *) exit 0 ;; esac
          F="$HOME/.config/pats/ios-dev-server-url"
          [ -f "$F" ] || exit 0
          URL=$(head -n 1 "$F" | tr -d '[:space:]')
          case "$URL" in https://*) ;; *) echo "error: PATS development URL must use HTTPS"; exit 1 ;; esac
          /usr/libexec/PlistBuddy -c "Set :PATSDevServerURL $URL" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
schemes:
  PATS:
    build:
      targets:
        PATS: all
    run:
      config: Debug
    archive:
      config: Release
