# PATS University PRODUCTION proxy (container pats-prod-proxy). Tracked in infra/prod/nginx/pats.conf,
# installed to ~/pats-prod/nginx/pats.conf by deploy-pats-prod.sh. Slot targets come from
# /etc/nginx/bluegreen/live.inc ($pats_live / $pats_idle), rewritten on every switch.

# Only cloudflared reaches :8080 (127.0.0.1 publish), so CF-Connecting-IP is the real client.
map $http_cf_connecting_ip $pats_client_ip { '' $remote_addr; default $http_cf_connecting_ip; }
map $http_upgrade $pats_connection { default upgrade; '' ''; }

limit_req_zone $pats_client_ip zone=pats_otp:10m rate=10r/m;
limit_req_zone $pats_client_ip zone=pats_all:20m rate=30r/s;
limit_req_status 429;
limit_req_log_level warn;

resolver 127.0.0.11 valid=5s ipv6=off;
server_tokens off;
client_max_body_size 16m;
proxy_read_timeout 120s;
proxy_http_version 1.1;

# ── Public: https://patsuniv.znetworks.id (via the pats-univ Cloudflare tunnel) ──
server {
  listen 8080;
  server_name _;
  include /etc/nginx/bluegreen/live.inc;

  if ($http_x_forwarded_proto = 'http') { return 301 https://$host$request_uri; }

  add_header Strict-Transport-Security 'max-age=31536000' always;
  add_header X-Content-Type-Options 'nosniff' always;
  add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
  add_header X-Frame-Options 'SAMEORIGIN' always;
  add_header Permissions-Policy 'camera=(self), microphone=(), geolocation=(self), payment=(), usb=()' always;
  add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $pats_client_ip;
  proxy_set_header X-Real-IP $pats_client_ip;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header Connection '';
  proxy_hide_header X-Powered-By;

  # Cron endpoints are internal only (127.0.0.1:3201).
  location ^~ /api/cron/ { return 404; }

  # Login / registration codes: 10 per minute per IP (burst 10); the app adds per-email limits.
  location ~ ^/api/(auth/otp|join/otp)(/|$) {
    limit_req zone=pats_otp burst=10 nodelay;
    proxy_pass http://$pats_live:3000;
  }

  # Realtime (Socket.IO) only; the realtime service's other routes are never public.
  location ^~ /socket.io/ {
    limit_req zone=pats_all burst=60 nodelay;
    set $pats_rt pats-prod-realtime;
    # A location with its own proxy_set_header inherits none from the server block: repeat them.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $pats_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $pats_connection;
    proxy_read_timeout 3600s;
    proxy_pass http://$pats_rt:4000;
  }

  location / {
    limit_req zone=pats_all burst=120 nodelay;
    proxy_pass http://$pats_live:3000;
  }
}

# ── Internal: the live slot, no limits (127.0.0.1:3201 on the VM; realtime API_URL) ──
server {
  listen 8081;
  include /etc/nginx/bluegreen/live.inc;
  proxy_set_header Host patsuniv.znetworks.id;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Connection '';
  add_header X-Pats-Slot $pats_live always;
  location / { proxy_pass http://$pats_live:3000; }
}

# ── Preview: the idle slot, before a switch (127.0.0.1:3202 on the VM) ──
server {
  listen 8082;
  include /etc/nginx/bluegreen/live.inc;
  proxy_set_header Host patsuniv.znetworks.id;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Connection '';
  add_header X-Pats-Slot $pats_idle always;
  location / { proxy_pass http://$pats_idle:3000; }
}
