# PATS University stack (PLAN.md §1, §3). Hosting, TLS, DNS (patsuniv.znetworks.id) and backups
# are set up by the main server session; see docs/INFRA-NEEDS.md.
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
name: pats-univ

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pats_univ
      POSTGRES_USER: pats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pats -d pats_univ']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pats:${POSTGRES_PASSWORD}@postgres:5432/pats_univ
      APP_URL: ${APP_URL:-https://patsuniv.znetworks.id}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      OTP_PROVIDER: ${OTP_PROVIDER:-email}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-PATS University <no-reply@patsuniv.znetworks.id>}
      # Cards: never change CARD_KEY_SECRET once cards are encoded (it derives every chip password).
      CARD_KEY_SECRET: ${CARD_KEY_SECRET:?set CARD_KEY_SECRET}
      CHROMIUM_PATH: /usr/bin/chromium
      # Files (print PDFs, flyers): local disk on the storage volume; S3 is optional (INFRA-NEEDS.md).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_DIR: /data/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-expo}
      REALTIME_INTERNAL_URL: http://realtime:4000
      REALTIME_PUBLIC_URL: ${REALTIME_PUBLIC_URL:?set REALTIME_PUBLIC_URL}
      REALTIME_SECRET: ${REALTIME_SECRET:?set REALTIME_SECRET}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
    volumes:
      - storage:/data/storage
    ports:
      - '127.0.0.1:3100:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  realtime:
    build:
      context: ..
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://web:3000
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      REALTIME_SECRET: ${REALTIME_SECRET:?set REALTIME_SECRET}
      # Comma-separated; defaults to APP_URL. The internal Tailscale host can be added while the domain is not public.
      CORS_ORIGINS: ${CORS_ORIGINS:-${APP_URL:-https://patsuniv.znetworks.id}}
    ports:
      - '127.0.0.1:3101:4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  # Print files and flyers. Back it up with the database.
  storage:
