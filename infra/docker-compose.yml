# PATS University stack (PLAN.md §1, §3). Hosting, TLS, DNS (patsuniv.znetworks.id) and backups
# are set up by the main server session; see docs/INFRA-NEEDS.md.
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
name: pats-univ

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pats_univ
      POSTGRES_USER: pats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pats -d pats_univ']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pats:${POSTGRES_PASSWORD}@postgres:5432/pats_univ
      APP_URL: ${APP_URL:-https://patsuniv.znetworks.id}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      OTP_PROVIDER: ${OTP_PROVIDER:-email}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-PATS University <no-reply@patsuniv.znetworks.id>}
    ports:
      - '127.0.0.1:3100:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  realtime:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ['node', 'src/server.mjs']
    volumes:
      - ../apps/realtime:/app:ro
    ports:
      - '127.0.0.1:3101:4000'

volumes:
  pgdata:
  miniodata:
